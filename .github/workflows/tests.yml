name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    env:
      NODARIS_HARNESS_NO_BG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Run tests
        run: python -m pytest

  # One stable check name for branch protection, whatever the matrix contains.
  tests:
    name: tests
    needs: pytest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix job to pass
        run: test "${{ needs.pytest.result }}" = "success"
